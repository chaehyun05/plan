<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Plan 연간 계획</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Poppins:wght@500;600&display=swap">
<style>
/* 루틴·습관 페이지와 같은 톤: ink #111433, accent #2340E8 */
:root{--ink:#111433;--muted:#6A6F8E;--line:#DCDFEA;--soft:#EEF1FF;--accent:#2340E8;--track:#F0F2F7;--warn:#C62828;
  --body:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;--num:Poppins,var(--body);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--body);line-height:1.5;font-size:15px}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.page{display:flex;flex-direction:column;gap:18px;padding:0 2px 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;cursor:pointer;font-size:13px;font-weight:700;line-height:1.4}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--warn)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:4px 6px;border-radius:6px}
.x:hover{color:var(--warn);background:#FDECEC}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.muted{color:var(--muted)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted);margin:0}
/* 입력칸: 평소엔 글처럼, 누르면 칸처럼 */
.ed{border:1px solid transparent;border-radius:8px;padding:4px 8px;background:transparent;min-width:0;width:100%}
.ed:hover{border-color:var(--line)}
.ed:focus{border-color:var(--accent);background:#fff;outline:0}
textarea.ed{resize:vertical;min-height:34px}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid #EDEEF3}
.top h1{margin:0;font-size:26px;font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.top h1 button{width:32px;height:32px;padding:0}
.overall{font-size:13px;color:var(--muted);text-align:right}
.overall b{display:block;font-family:var(--num);font-size:26px;color:var(--accent);line-height:1.1}
.vision{background:var(--soft);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.vision label{font-size:12px;font-weight:700;color:var(--accent)}
.vision .ed.big{font-size:18px;font-weight:900}
.top3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.top3 .ed{background:#fff;border-color:#DDE2FA;font-weight:700}
.vtabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.vtabs button{border:0;background:none;padding:9px 12px;font-weight:700;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.vtabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.track{height:7px;background:var(--track);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width .2s}

/* 목표 카드 */
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.area{border:1px solid #EDEEF3;border-top:4px solid var(--c);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.area-head{display:flex;align-items:center;gap:6px}
.area-head .ed{font-weight:900;font-size:16px}
.area-head input[type=color]{width:26px;height:26px;border:0;padding:0;background:none;cursor:pointer;flex:0 0 auto}
.lbl{font-size:11px;font-weight:700;color:var(--muted);margin:2px 0 -4px 8px}
.goal{font-weight:700}
.kr{display:flex;align-items:center;gap:4px}
.kr input[type=checkbox],.item input[type=checkbox]{width:18px;height:18px;flex:0 0 auto;accent-color:var(--c,var(--accent));cursor:pointer}
.kr.done .ed,.item.done .ed{text-decoration:line-through;color:var(--muted)}
.area .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.add-line{display:flex;gap:6px}
.add-line input{flex:1;border:1px dashed var(--line);border-radius:8px;padding:5px 9px;min-width:0}

/* 월별 */
.quarter{display:flex;flex-direction:column;gap:10px}
.q-head{display:flex;align-items:center;gap:10px}
.q-head h3{margin:0;font-size:16px;white-space:nowrap}
.q-head .track{flex:1}
.months{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.month{border:1px solid #EDEEF3;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.month.now{border-color:var(--accent);box-shadow:0 0 0 2px var(--soft)}
.month h4{margin:0;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.month h4 small{font-family:var(--num);color:var(--muted);font-weight:600}
.item{display:flex;align-items:center;flex-wrap:wrap;gap:0 3px;border-left:3px solid var(--c);padding:2px 0 4px 4px}
.item .ed{flex:1 1 0;width:auto}
.item .ctl{display:flex;align-items:center;gap:4px;margin-left:22px;width:calc(100% - 22px)}
.item .ctl select{flex:1}
.item select{border:0;background:none;font-size:11px;color:var(--c);font-weight:700;padding:0;cursor:pointer;min-width:0}
.item .todo{font-size:11px;white-space:nowrap}
.filter{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}

/* 일정 */
.events{display:flex;flex-direction:column;gap:6px}
.ev{display:grid;grid-template-columns:86px 150px 1fr 110px auto;align-items:center;gap:8px;border:1px solid #EDEEF3;border-left:4px solid var(--c);border-radius:10px;padding:6px 8px}
.ev b{font-family:var(--num);color:var(--accent);font-size:15px}
.ev.past b{color:var(--muted)}
.ev input[type=date]{border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.ev select{border:1px solid var(--line);border-radius:8px;padding:4px 6px;min-width:0}
.memo textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:10px}
.foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;border-top:1px solid #EDEEF3;padding-top:12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:760px){
  .months{grid-template-columns:1fr}
  .top3{grid-template-columns:1fr}
  .areas{grid-template-columns:1fr}
  .ev{grid-template-columns:64px 1fr auto;grid-template-areas:"d n x" "d dt a"}
  .ev b{grid-area:d}.ev .ev-name{grid-area:n}.ev input[type=date]{grid-area:dt}.ev select{grid-area:a}.ev .x{grid-area:x}
}
</style>
</head>
<body>
<div class="page" id="page">
  <div class="top">
    <h1><button type="button" class="btn" id="y-prev" aria-label="이전 해">‹</button><span class="num" id="y-label"></span>년 연간 계획<button type="button" class="btn" id="y-next" aria-label="다음 해">›</button></h1>
    <div class="overall"><b id="overall">0%</b>올해 전체 달성률</div>
  </div>

  <div class="vision">
    <label for="v-vision">올해 한 줄 비전</label>
    <input class="ed big" id="v-vision" data-f="vision" placeholder="예: 세상을 넓게 보고, 실력으로 증명하는 한 해">
    <label>올해 이것만큼은 꼭 (TOP 3)</label>
    <div class="top3" id="top3"></div>
  </div>

  <div class="vtabs" role="tablist" aria-label="연간 계획 보기">
    <button type="button" role="tab" data-v="goals" aria-selected="true">영역별 목표</button>
    <button type="button" role="tab" data-v="months" aria-selected="false">분기·월별 계획</button>
    <button type="button" role="tab" data-v="events" aria-selected="false">주요 일정 D-day</button>
    <button type="button" role="tab" data-v="memo" aria-selected="false">장기 비전·메모</button>
  </div>

  <section id="v-goals">
    <div class="areas" id="areas"></div>
    <div class="row" style="margin-top:12px"><button type="button" class="btn" id="add-area">＋ 영역 추가</button><span class="note">영역 8개는 만다라트 바깥 8칸과 1:1로 맞춰져요.</span></div>
  </section>

  <section id="v-months" hidden>
    <div class="filter" id="filter"></div>
    <div id="quarters" style="display:flex;flex-direction:column;gap:18px;margin-top:12px"></div>
  </section>

  <section id="v-events" hidden>
    <p class="note" style="margin-bottom:10px">시험·접수·출국처럼 날짜가 정해진 일정이에요. 날짜순으로 정렬되고 D-day가 계산돼요.</p>
    <div class="events" id="events"></div>
    <form class="add-line" id="ev-form" style="margin-top:10px"><input id="ev-name" placeholder="일정 이름 (예: 정보처리기사 1회 필기)" aria-label="일정 이름"><input type="date" id="ev-date" aria-label="날짜" style="flex:0 0 150px;border-style:solid"><button class="btn primary sm">추가</button></form>
  </section>

  <section id="v-memo" hidden class="memo">
    <p class="note" style="margin-bottom:8px">3년·5년 뒤 모습, 올해 안 하기로 미룬 것들, 떠오르는 아이디어를 적어두세요.</p>
    <textarea id="memo" data-f="memo" aria-label="장기 비전 메모"></textarea>
  </section>

  <div class="foot">
    <button type="button" class="btn" id="to-mandal">만다라트로 보내기</button>
    <button type="button" class="btn" id="load-draft" hidden>2027 초안 다시 불러오기</button>
    <button type="button" class="btn danger" id="clear-year">이 해 계획 비우기</button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(()=>{
'use strict';
const KEY='myplan-year-v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const now=new Date(),TODAY=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),1900)}

/* 저장: 부모 페이지 localStorage에 써야 기록방(클라우드)에 함께 저장됨 */
const STORE=(()=>{try{if(parent!==window&&parent.localStorage)return parent.localStorage}catch(e){}return localStorage})();
function read(){try{return JSON.parse(STORE.getItem(KEY)||'null')}catch(e){return null}}
let saveT;
function write(){clearTimeout(saveT);saveT=setTimeout(()=>{try{STORE.setItem(KEY,JSON.stringify(S))}catch(e){toast('저장에 실패했어요.')}},250)}

/* ---------- 2027 초안 (대화로 정리한 내용) ---------- */
function draft2027(){
  const A=(id,name,c,goal,why,krs)=>({id,name,c,goal,why,krs:krs.map(t=>({id:uid(),t,done:false}))});
  const areas=[
    A('vol','프봉 (카메룬)','#13996A','KOICA 프로젝트봉사단 10기 카메룬 지원 → 합격 시 4개월 파견 완주 / 불합격 시 플랜B','국제개발 + 전공(ICT 교육) 경험, 프랑스어·영어 실전',
      ['지원서 최종 제출 + 학점인정제 학교 추천 (지원 중)','면접 준비 → 합격 발표 확인','플랜B: 불합격이면 4~7월 알바 연장 + 정보처리기사 실기 + 토익 집중','출국 전 프랑스어 생존 회화 100문장','현지: AI 커리큘럼 파일럿 수업·협력티칭','활동 기록 매주 → 귀국 후 포트폴리오·자소서 소재로 정리']),
    A('cert','자격증 (기사 8개, 2030 상반기까지)','#2340E8','드래곤볼 기사 8개를 4학년 2학기(2030.6)까지: 2027 ①정처기 ②정보통신 → 2028 ③산업안전 ④빅분기 ⑤전기 → 2029 ⑥전자 ⑦정보보안 → 2030 ⑧일반기계','전산직 가산점(기사 5%) + 대기업 IT·하드웨어 + 드래곤볼',
      ['리눅스마스터 2급 2차 (객관식 · 기한 약 1년, 상반기 회차)','네트워크관리사 2급 실기 (랜선 제작+시뮬레이션)','PC정비사 2급 실기 (에뮬레이터)','한능검 3급 (82회 · 2/13)','① 정보처리기사 필기 (1회, 출국 전)','① 정보처리기사 실기 (3회, 10~11월)','② 정보통신기사 하반기 회차 (cq.or.kr 응시자격·일정 확인)','정보보안기사 응시자격 확인 (KISA)']),
    A('gov','9급 전산직','#7A3FE0','전산직 기본기 완성 → 2028 국가직 응시 준비','안정적인 첫 직장 → 대기업 이직 발판',
      ['응시 연도 확정 (2027 3/27은 참고 응시 or 패스)','컴퓨터일반 기본강의 1회독 (하반기)','정보보호론 기본강의 1회독 (하반기)','국어·영어 기출 루틴 (주 3회)']),
    A('dev','개발·코테·부트캠프','#0E7C86','코테 실전 수준 + 부트캠프 1곳 + 앱 1개 배포','대기업 개발자 합격의 핵심 무기',
      ['코테 하루 1문제 (프봉 중엔 주 3문제)','싸피 전 갈 수 있는 부트캠프 1곳 선정·지원','언어 순서: Python·C → Java → HTML/CSS/JS → Kotlin(안드로이드)·Swift(iOS) → C++·C#','개인 프로젝트 1개 배포 (깃허브 정리)']),
    A('lang','언어','#D9771E','영어·프랑스어: 프리토킹·의전 가능 수준으로 / 일·중·스: 여행 회화','카메룬(불·영 이중언어), 면접, 여행',
      ['프랑스어 A1 → DELF A2 응시 (연말)','영어 매일 스피킹 15분 + 토익 (복학 전 850)','OPIc IH (연말)','아나운서 발성·발음 매일 10분, 월 1회 녹음 비교','일본어 여행 회화 (몽골·일본 여행 전)']),
    A('money','돈 (28살 1억)','#B8860B','2027년 말 잔액 1,100만 원 (지출 약 900만 반영) → 28살 1억 로드맵 첫해','5년 안 부동산 공부·투자 시드',
      ['알바 월급날 140만 원 자동이체 (파킹통장/적금)','비상금 100만 원 따로','경제 뉴스 주 3회 + 경제 책 매달 1권','주식: 소액·기록 먼저, 매월 결산','월 지출 예산표대로 쓰기 (가계부 탭)','연말 잔액 1,100만 원']),
    A('body','몸','#C2185B','체중보다 체성분: 체지방 줄이고 근육 늘려 탄탄한 몸','자신감, 체력, 면접 인상',

    A('life','취미·요리·외모·여행','#5D4037','주 1권 독서 + 한식조리기능사 + 외모 루틴 + 기타·피아노 + SNS + 상 2개 + 여행','삶이 공부만으로 채워지지 않게, 기록이 곧 포트폴리오',
      ['독서 주 1권 (연 52권) + 한 줄 기록','한식조리기능사 (하반기, 내일배움카드 국비반)','외모 관리 루틴: 피부·헤어 (월 10만 원 안에서)','기타·피아노 주 2회 연습, 연말에 한 곡 완곡 영상','SNS 주 2회 업로드 (프봉·공부·운동 기록)','공모전·대회 상 2개','몽골 여행 (해봉 귀국 직후 7~8월, 1주)','일본 여행 (3월 정처기 필기 후 짧게 or 2028 여름)'])
  ];
  const M={};const it=(m,a,t)=>(M[m]=M[m]||[]).push({id:uid(),t,a,done:false});
  it(1,'vol','프봉 면접·합격 발표 확인 → 합격/플랜B 결정');
  it(1,'money','계절학기 종강(1/12) → 알바 시작 · 월급 140만 자동이체 설정');
  it(1,'cert','한능검 하루 1강 + 기출');
  it(1,'cert','정보처리기사 1회 필기 접수 (1/18~1/21, 첫날 10시)');
  it(1,'lang','프랑스어 A1 시작 (매일 20분)');
  it(1,'body','인바디 첫 측정 · 운동 루틴 시작');
  it(1,'life','책 4권 · SNS 계정 방향 정하기');

const blank=()=>({vision:'',top3:['','',''],areas:[],months:{},events:[],memo:''});

let S=read();
if(!S||!S.years){S={v:1,cur:2027,years:{2027:draft2027()}};write()}
let Y=S.cur||2027,view='goals',filterA='';
const D=()=>S.years[Y]||(S.years[Y]=blank());

/* ---------- 계산 ---------- */
const areaOf=id=>D().areas.find(a=>a.id===id);
const colorOf=id=>areaOf(id)?.c||'#9AA0B8';
const pct=(n,d)=>d?Math.round(n/d*100):0;
function allItems(){return Object.values(D().months).flat()}
function overall(){const krs=D().areas.flatMap(a=>a.krs),its=allItems();const n=krs.filter(k=>k.done).length+its.filter(i=>i.done).length;return pct(n,krs.length+its.length)}
const dday=d=>{const [y,m,dd]=d.split('-').map(Number);const n=Math.round((new Date(y,m-1,dd)-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5);return n===0?'D-DAY':n>0?'D-'+n:'D+'+(-n)};
const areaSelect=(sel)=>D().areas.map(a=>`<option value="${a.id}"${a.id===sel?' selected':''}>${esc(a.name)}</option>`).join('');

/* ---------- 그리기 ---------- */
function render(){
  const d=D();
  $('y-label').textContent=Y;
  $('overall').textContent=overall()+'%';
  $('v-vision').value=d.vision||'';
  $('memo').value=d.memo||'';
  $('top3').innerHTML=[0,1,2].map(i=>`<input class="ed" data-top="${i}" value="${esc(d.top3[i]||'')}" placeholder="${i+1}순위" aria-label="TOP ${i+1}">`).join('');
  $('load-draft').hidden=Y!==2027;
  document.querySelectorAll('.vtabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.v===view)));
  ['goals','months','events','memo'].forEach(v=>$('v-'+v).hidden=v!==view);
  if(view==='goals')renderAreas();
  if(view==='months')renderMonths();
  if(view==='events')renderEvents();
  report();
}
function renderAreas(){
  $('areas').innerHTML=D().areas.map(a=>{
    const done=a.krs.filter(k=>k.done).length,mi=allItems().filter(i=>i.a===a.id),md=mi.filter(i=>i.done).length;
    return `<article class="area" style="--c:${a.c}" data-area="${a.id}">
      <div class="area-head"><input type="color" value="${a.c}" data-af="c" aria-label="색"><input class="ed" value="${esc(a.name)}" data-af="name" aria-label="영역 이름"><button type="button" class="x" data-del-area title="영역 삭제" aria-label="영역 삭제">×</button></div>
      <div class="lbl">연간 목표</div><textarea class="ed goal" rows="1" data-af="goal" placeholder="올해 이 영역에서 이루고 싶은 것">${esc(a.goal)}</textarea>
      <div class="lbl">왜?</div><input class="ed muted" value="${esc(a.why)}" data-af="why" placeholder="이 목표가 중요한 이유">
      <div class="lbl">핵심 결과 (체크하면 달성)</div>
      ${a.krs.map(k=>`<div class="kr${k.done?' done':''}" data-kr="${k.id}"><input type="checkbox"${k.done?' checked':''} aria-label="달성"><input class="ed" value="${esc(k.t)}" aria-label="핵심 결과"><button type="button" class="x" data-del-kr aria-label="삭제">×</button></div>`).join('')}
      <form class="add-line" data-add-kr><input placeholder="＋ 핵심 결과 추가" aria-label="핵심 결과 추가"></form>
      <div class="track"><i style="width:${pct(done,a.krs.length)}%;background:${a.c}"></i></div>
      <div class="meta"><span>핵심 결과 ${done}/${a.krs.length}</span><span>월별 할 일 ${md}/${mi.length}</span></div>
    </article>`}).join('');
  $('areas').querySelectorAll('textarea').forEach(fit);
}
function renderMonths(){
  const d=D();
  $('filter').innerHTML=`<button type="button" class="chip" data-fa="" aria-pressed="${!filterA}">전체</button>`+d.areas.map(a=>`<button type="button" class="chip" style="--c:${a.c}" data-fa="${a.id}" aria-pressed="${filterA===a.id}"><i></i>${esc(a.name)}</button>`).join('');
  const curM=now.getFullYear()===Y?now.getMonth()+1:0;
  $('quarters').innerHTML=[1,2,3,4].map(q=>{
    const ms=[q*3-2,q*3-1,q*3],its=ms.flatMap(m=>d.months[m]||[]),dn=its.filter(i=>i.done).length;
    return `<div class="quarter"><div class="q-head"><h3>${q}분기 <span class="muted num" style="font-size:13px">${ms[0]}~${ms[2]}월</span></h3><div class="track"><i style="width:${pct(dn,its.length)}%"></i></div><span class="num muted" style="font-size:13px">${dn}/${its.length}</span></div>
    <div class="months">${ms.map(m=>{const list=(d.months[m]||[]).filter(i=>!filterA||i.a===filterA);const all=d.months[m]||[];
      return `<div class="month${m===curM?' now':''}" data-m="${m}"><h4>${m}월<small>${all.filter(i=>i.done).length}/${all.length}</small></h4>
      ${list.map(i=>`<div class="item${i.done?' done':''}" style="--c:${colorOf(i.a)}" data-it="${i.id}"><input type="checkbox"${i.done?' checked':''} aria-label="완료"><input class="ed" value="${esc(i.t)}" aria-label="할 일"><div class="ctl"><select aria-label="영역">${areaSelect(i.a)}</select><button type="button" class="btn sm todo" data-todo title="투두리스트에 추가">→투두</button><button type="button" class="x" data-del-it aria-label="삭제">×</button></div></div>`).join('')}
      <form class="add-line" data-add-it><input placeholder="＋ ${m}월 할 일" aria-label="${m}월 할 일 추가"></form></div>`}).join('')}</div></div>`}).join('');
}
function renderEvents(){
  const ev=[...D().events].sort((a,b)=>a.date.localeCompare(b.date));
  $('events').innerHTML=ev.length?ev.map(e=>`<div class="ev${e.date<TODAY?' past':''}" style="--c:${colorOf(e.a)}" data-ev="${e.id}"><b>${dday(e.date)}</b><input type="date" value="${e.date}" aria-label="날짜"><input class="ed ev-name" value="${esc(e.name)}" aria-label="일정 이름"><select aria-label="영역"><option value="">영역 없음</option>${areaSelect(e.a)}</select><button type="button" class="x" data-del-ev aria-label="삭제">×</button></div>`).join(''):'<p class="note">아직 일정이 없어요.</p>';
}
function fit(t){t.style.height='auto';t.style.height=t.scrollHeight+2+'px'}
function report(){try{if(parent!==window){requestAnimationFrame(()=>{const h=Math.ceil($('page').getBoundingClientRect().height)+40;parent.postMessage({type:'myplan-year-height',height:h},location.origin)})}}catch(e){}}

/* ---------- 입력 ---------- */
const findKr=el=>{const a=areaOf(el.closest('[data-area]').dataset.area);return [a,a.krs.find(k=>k.id===el.closest('[data-kr]').dataset.kr)]};
const findIt=el=>{const m=el.closest('[data-m]').dataset.m;return [m,D().months[m].find(i=>i.id===el.closest('[data-it]').dataset.it)]};
document.addEventListener('input',e=>{
  const t=e.target,d=D();
  if(t.dataset.f){d[t.dataset.f]=t.value;return write()}
  if(t.dataset.top){d.top3[+t.dataset.top]=t.value;return write()}
  if(t.dataset.af){const a=areaOf(t.closest('[data-area]').dataset.area);a[t.dataset.af]=t.value;if(t.tagName==='TEXTAREA')fit(t);if(t.dataset.af==='c'){t.closest('.area').style.setProperty('--c',t.value)}return write()}
  if(t.closest('[data-kr]')&&t.type!=='checkbox'){findKr(t)[1].t=t.value;return write()}
  if(t.closest('[data-it]')&&t.classList.contains('ed')){findIt(t)[1].t=t.value;return write()}
  if(t.closest('[data-ev]')&&t.classList.contains('ed')){D().events.find(x=>x.id===t.closest('[data-ev]').dataset.ev).name=t.value;return write()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.type==='checkbox'&&t.closest('[data-kr]')){findKr(t)[1].done=t.checked;write();render();if(t.checked)toast('핵심 결과 달성! 🎉');return}
  if(t.type==='checkbox'&&t.closest('[data-it]')){findIt(t)[1].done=t.checked;write();render();return}
  if(t.tagName==='SELECT'&&t.closest('[data-it]')){findIt(t)[1].a=t.value;write();render();return}
  if(t.closest('[data-ev]')){const ev=D().events.find(x=>x.id===t.closest('[data-ev]').dataset.ev);if(t.type==='date'&&t.value)ev.date=t.value;if(t.tagName==='SELECT')ev.a=t.value;write();render();return}
  if(t.dataset.af==='c')render();
});
document.addEventListener('submit',e=>{
  const f=e.target;e.preventDefault();
  const inp=f.querySelector('input'),v=inp?.value.trim();
  if(f.id==='ev-form'){const n=$('ev-name').value.trim(),dt=$('ev-date').value;if(!n||!dt){toast('이름과 날짜를 넣어주세요.');return}D().events.push({id:uid(),name:n,date:dt,a:''});write();render();return}
  if(!v)return;
  if(f.dataset.addKr!==undefined){areaOf(f.closest('[data-area]').dataset.area).krs.push({id:uid(),t:v,done:false})}
  if(f.dataset.addIt!==undefined){const m=f.closest('[data-m]').dataset.m;(D().months[m]=D().months[m]||[]).push({id:uid(),t:v,a:filterA||D().areas[0]?.id||'',done:false})}
  write();render();
  const sel=f.dataset.addKr!==undefined?`[data-area="${f.closest?.('[data-area]')?.dataset.area}"] [data-add-kr] input`:null;
  const again=document.querySelector(f.dataset.addIt!==undefined?`[data-m="${f.closest('[data-m]')?.dataset.m}"] [data-add-it] input`:sel);again?.focus();
});
document.addEventListener('click',e=>{
  const t=e.target;
  const vt=t.closest('.vtabs button');if(vt){view=vt.dataset.v;render();return}
  const fa=t.closest('[data-fa]');if(fa){filterA=fa.dataset.fa;render();return}
  if(t.closest('[data-del-kr]')){const [a,k]=findKr(t);a.krs.splice(a.krs.indexOf(k),1);write();render();return}
  if(t.closest('[data-del-it]')){const [m,i]=findIt(t);D().months[m].splice(D().months[m].indexOf(i),1);write();render();return}
  if(t.closest('[data-del-ev]')){const id=t.closest('[data-ev]').dataset.ev;D().events=D().events.filter(x=>x.id!==id);write();render();return}
  if(t.closest('[data-del-area]')){const a=areaOf(t.closest('[data-area]').dataset.area);if(!confirm(`"${a.name}" 영역을 지울까요? 이 영역의 월별 할 일은 남아요.`))return;D().areas=D().areas.filter(x=>x!==a);write();render();return}
  if(t.closest('[data-todo]')){const [m,i]=findIt(t);const last=new Date(Y,+m,0);const due=`${Y}-${pad(+m)}-${pad(last.getDate())}`;
    try{parent.myPlanYearBridge.addTodo(i.t,due);toast(`투두리스트에 추가했어요 (마감 ${m}/${last.getDate()})`)}catch(err){toast('투두리스트 연결은 My Plan 안에서만 돼요.')}return}
});
$('add-area').onclick=()=>{const cs=['#2340E8','#13996A','#D9771E','#7A3FE0','#C2185B','#0E7C86','#B8860B','#5D4037'];D().areas.push({id:uid(),name:'새 영역',c:cs[D().areas.length%cs.length],goal:'',why:'',krs:[]});write();render()};
$('y-prev').onclick=()=>{Y--;S.cur=Y;write();render()};
$('y-next').onclick=()=>{Y++;S.cur=Y;write();render()};
$('load-draft').onclick=()=>{if(!confirm('2027년 계획을 처음 초안으로 되돌릴까요? 지금 2027년에 적은 내용은 사라져요.'))return;S.years[2027]=draft2027();write();render();toast('초안을 불러왔어요.')};
$('clear-year').onclick=()=>{if(!confirm(`${Y}년 계획을 모두 비울까요?`))return;S.years[Y]=blank();write();render()};
/* 만다라트: 가운데 = 올해 비전, 바깥 8칸 = 영역, 각 영역 칸 주변 8칸 = 핵심 결과 */
$('to-mandal').onclick=()=>{
  const d=D(),ar=d.areas.filter(a=>a.id!=='life').slice(0,8);
  if(!ar.length){toast('영역을 먼저 추가하세요.');return}
  const cells=Array.from({length:9},()=>Array(9).fill(''));
  const order=[0,1,2,3,5,6,7,8];
  cells[4][4]=d.vision||`${Y}년`;
  ar.forEach((a,i)=>{const b=order[i];cells[4][b]=a.name;cells[b][4]=a.name;a.krs.slice(0,8).forEach((k,j)=>{cells[b][order[j]]=k.t})});
