<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Plan 루틴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Poppins:wght@500;600&display=swap">
<style>
/* Matches My Plan's habits page: ink #111433, accent #2340E8, soft #EEF1FF, light only */
:root{--ink:#111433;--muted:#6A6F8E;--line:#DCDFEA;--soft:#EEF1FF;--accent:#2340E8;--bg:#fff;--track:#F0F2F7;--done:#FFF4B8;--warn:#C62828;
  --body:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;--num:Poppins,var(--body);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;font-size:15px}
[hidden]{display:none!important}
.page{display:flex;flex-direction:column;gap:18px;padding:0 2px 12px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;cursor:pointer;font-size:13px;font-weight:700;line-height:1.4}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--warn)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;min-width:0}
h2{font-size:19px;font-weight:900;margin:0;letter-spacing:-.02em}
h3{font-size:15px;font-weight:700;margin:0}
.muted{color:var(--muted)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.card{background:#fff;border:1px solid #EDEEF3;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.note{font-size:13px;color:var(--muted);margin:0}

/* top */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid #EDEEF3}
.top h1{margin:0;font-size:26px;font-weight:900;letter-spacing:-.02em}
.streak{font-size:13px;color:var(--muted);text-align:right}
.streak b{display:block;font-family:var(--num);font-size:26px;color:var(--accent);line-height:1.1}
.ddays{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.dd{flex:0 0 auto;min-width:128px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:1px;cursor:pointer;background:#fff;text-align:left}
.dd b{font-family:var(--num);font-size:20px;color:var(--accent)}
.dd span{font-size:13px;font-weight:700}
.dd small{font-size:12px;color:var(--muted)}

/* view tabs */
.vtabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.vtabs button{border:0;background:none;padding:9px 12px;font-weight:700;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.vtabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}

/* nav */
.nav{display:flex;align-items:center;gap:8px}
.nav .label{font-weight:900;font-size:18px;min-width:0}
.nav button{width:34px;height:34px;padding:0}

/* progress */
.prog{display:flex;flex-direction:column;gap:6px}
.track{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .2s}

/* items */
.area-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);margin-top:4px}
.sw{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.item{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:#fff}
.item input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent);margin:0;cursor:pointer}
.item .t{min-width:0;overflow-wrap:anywhere;font-weight:500}
.item .sub{font-size:12px;color:var(--muted);display:block;font-weight:400}
.item .r{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.item.done{background:var(--done);border-color:#F0DE7A}
.item.done .t{text-decoration:line-through;text-decoration-color:#B9A23A}
.list{display:flex;flex-direction:column;gap:6px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--accent);white-space:nowrap}
.pill.gray{background:var(--track);color:var(--muted)}
a.link{color:var(--accent);font-size:12px;font-weight:700;text-decoration:none;margin-left:6px}
.empty{font-size:14px;color:var(--muted);padding:6px 0}

/* week grid */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.wk{border-collapse:separate;border-spacing:4px;width:100%;min-width:560px}
.wk th{font-size:12px;font-weight:500;color:var(--muted);text-align:center;padding-bottom:4px}
.wk th.nm,.wk td.nm{text-align:left;font-size:14px;font-weight:500;color:var(--ink);width:38%}
.wk th.today{color:var(--accent);font-weight:700}
.wk td.nm .sw{display:inline-block;margin-right:6px;vertical-align:1px}
.wk td.cnt{font-family:var(--num);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;width:60px}
.cell{display:block;width:100%;aspect-ratio:1/1;max-height:34px;min-width:24px;border:1px solid #E3E6EF;border-radius:7px;background:#F4F5F9;cursor:pointer;padding:0}
.cell.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}

/* month */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:12px;color:var(--muted);text-align:center;padding-bottom:2px}
.cal .h.sun{color:var(--warn)}
.day{border:1px solid #EDEEF3;border-radius:8px;min-height:62px;padding:4px 5px;display:flex;flex-direction:column;gap:2px;cursor:pointer;background:#fff;text-align:left;min-width:0}
.day.out{visibility:hidden}
.day .dn{font-family:var(--num);font-size:12px;color:var(--muted)}
.day.today{border-color:var(--accent)}
.day.today .dn{color:var(--accent);font-weight:600}
.day .bar{height:4px;border-radius:2px;background:var(--track);overflow:hidden;margin-top:auto}
.day .bar i{display:block;height:100%;background:var(--accent)}
.day .ev{font-size:11px;font-weight:700;color:#fff;background:var(--c,var(--accent));border-radius:4px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .pl{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* year */
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:120px}
.mo{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;cursor:pointer;border:0;background:none;padding:0}
.mo .b{width:100%;max-width:26px;flex:1;background:var(--track);border-radius:4px;display:flex;align-items:flex-end;overflow:hidden}
.mo .b i{display:block;width:100%;background:var(--accent)}
.mo span{font-size:11px;color:var(--muted)}
.mo.cur span{color:var(--accent);font-weight:700}
.goal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px}
.goal .track{grid-column:1/-1}
.goal .logs{grid-column:1/-1;font-size:12px;color:var(--muted)}

/* events */
.ev-card{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ev-card .dday{font-family:var(--num);font-size:22px;color:var(--accent);font-weight:600}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700}
.form .full{grid-column:1/-1}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.modes label{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:500;cursor:pointer}
.modes input{accent-color:var(--accent)}
.modes label:has(input:checked){border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:700}
.subj{display:grid;grid-template-columns:minmax(0,1fr) 80px 70px auto;gap:6px}
.wkplan{display:flex;flex-direction:column;gap:6px}
.wkplan .w{display:grid;grid-template-columns:22px 92px minmax(0,1fr);gap:8px;align-items:center}
.wkplan .w input[type=text]{width:100%}
.wkplan .w.cur .wd{color:var(--accent);font-weight:700}
.wkplan .wd{font-size:12px;color:var(--muted);font-family:var(--num)}
details.plan summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--accent)}
.planlist{display:flex;flex-direction:column;gap:2px;margin-top:8px;max-height:360px;overflow:auto;font-size:13px}
.planlist .pd{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;padding:4px 0;border-top:1px dashed #EDEEF3}
.planlist .pd.today{background:var(--soft);border-radius:6px}
.planlist .pd .d{font-family:var(--num);color:var(--muted);font-size:12px;padding-top:1px}
.planlist .pd s{color:var(--muted)}
.phase{font-size:11px;font-weight:700;color:var(--muted)}

/* manage */
.mrow{display:grid;grid-template-columns:130px minmax(0,1fr) 110px 70px auto;gap:6px;align-items:center}
.mrow input,.mrow select{width:100%}
.arow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed #EDEEF3}
.arow:first-child{border-top:0}
.arow input{width:100%}
.arow .full-w{grid-column:2/-1}
.colors{display:flex;gap:4px;flex-wrap:wrap}
.cdot{width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:var(--c);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.cdot.on{box-shadow:0 0 0 2px var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
@media(max-width:640px){.arow{grid-template-columns:auto minmax(0,1fr) auto}.arow .colors{grid-column:2/-1;grid-row:2}.arow .full-w{grid-row:3}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

@media(max-width:640px){
  .card{padding:14px}
  .top h1{font-size:22px}
  .form{grid-template-columns:1fr}
  .subj{grid-template-columns:minmax(0,1fr) 64px 56px auto}
  .mrow{grid-template-columns:1fr 1fr;padding:8px;border:1px solid #EDEEF3;border-radius:10px}
  .mrow .mt{grid-column:1/-1}
  .day{min-height:48px;padding:3px}
  .day .pl{display:none}
  .months{height:96px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="page" id="page">
  <div class="top">
    <div>
      <div class="muted" id="today-label" style="font-size:13px"></div>
      <h1>인생 루틴</h1>
    </div>
    <div class="streak">일간 루틴 연속<b id="streak">0일</b></div>
  </div>

  <div class="ddays" id="ddays" aria-label="다가오는 일정"></div>

  <div class="vtabs" role="tablist" id="vtabs">
    <button role="tab" data-v="day" aria-selected="true">일간</button>
    <button role="tab" data-v="week" aria-selected="false">주간</button>
    <button role="tab" data-v="month" aria-selected="false">월간</button>
    <button role="tab" data-v="year" aria-selected="false">연간</button>
    <button role="tab" data-v="events" aria-selected="false">일정·공부계획</button>
    <button role="tab" data-v="manage" aria-selected="false">루틴 관리</button>
  </div>

  <section id="v-day"></section>
  <section id="v-week" hidden></section>
  <section id="v-month" hidden></section>
  <section id="v-year" hidden></section>
  <section id="v-events" hidden></section>
  <section id="v-manage" hidden></section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(()=>{
'use strict';
const KEY='myplan-routine-v1';
const ENGLISH_URL='https://chaehyun05.github.io/english/';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const monday=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
const WD=['일','월','화','수','목','금','토'];
const fmtMD=s=>{const d=parse(s);return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`};
let TODAY=ymd(new Date());
const uid=()=>Math.random().toString(36).slice(2,9);
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),1800)}

/* ---------- storage: parent's localStorage so the cloud room saves it ---------- */
const STORE=(()=>{try{if(parent!==window&&parent.localStorage)return parent.localStorage}catch(e){}return localStorage})();
function read(){try{return JSON.parse(STORE.getItem(KEY)||'null')}catch(e){return null}}
function write(){try{STORE.setItem(KEY,JSON.stringify(S))}catch(e){toast('저장에 실패했어요. 저장 공간을 확인해 주세요.')}}

/* ---------- defaults ---------- */
const FREQ={daily:'매일',weekly:'주',monthly:'월',yearly:'연'};
function seed(){
  const A=[{id:'study',name:'공부·자격증',c:'#2340E8'},{id:'career',name:'커리어·코딩',c:'#7A3FE0'},{id:'health',name:'건강·운동',c:'#13996A'},{id:'life',name:'돈·생활',c:'#D9771E'}];
  const R=(area,title,freq,target,extra)=>({id:uid(),area,title,freq,target,...(extra||{})});
  const s={v:1,areas:A,routines:[
    R('study','영어 할당량 채우기','daily',1,{link:ENGLISH_URL}),
    R('study','한능검 강의 1강 + 기출','daily',1),
    R('study','컴퓨터일반 전공 복습','weekly',3),
    R('career','코딩테스트 1문제','daily',1),
    R('career','개인 프로젝트 작업','weekly',2),
    R('career','공부 기록·회고 글 쓰기','monthly',2),
    R('health','7시간 이상 자기','daily',1),
    R('health','스트레칭 10분','daily',1),
    R('health','복싱','weekly',5),
    R('life','가계부 기록','daily',1),
    R('life','방 정리','weekly',1),
    R('life','한 달 지출 결산','monthly',1),
    R('life','책 한 권 읽기','monthly',1),
    R('study','자격증 취득 (한능검 3급·토익 470+)','yearly',2),
    R('life','저축하기 (한 달에 한 번 기록)','yearly',12)
  ],checks:{},events:[],memo:{}};
  s.events.push(makeEvent({name:'한능검 82회 원서 접수',date:'2027-01-12',area:'study',mode:'none'}));
  s.events.push(makeEvent({name:'한능검 82회 시험',date:'2027-02-13',area:'study',mode:'auto',start:TODAY,dailyMin:60,subjects:[{name:'한국사 강의',units:40,unit:'강'}]}));
  return s;
}
let S=read();
if(!S||!S.routines){S=seed();write()}
S.checks=S.checks||{};S.events=S.events||[];S.memo=S.memo||{};

/* ---------- helpers ---------- */
const area=id=>S.areas.find(a=>a.id===id)||S.areas[0];
const isOn=(d,id)=>(S.checks[d]||[]).includes(id);
function toggle(d,id,force){const a=S.checks[d]||(S.checks[d]=[]);const i=a.indexOf(id);const on=force!==undefined?force:i<0;
  if(on&&i<0)a.push(id);if(!on&&i>=0)a.splice(i,1);if(!a.length)delete S.checks[d];write()}
function periodRange(freq,d){
  if(freq==='weekly'){const s=monday(d);return [s,addDays(s,6)]}
  const x=parse(d);
  if(freq==='monthly'){return [ymd(new Date(x.getFullYear(),x.getMonth(),1)),ymd(new Date(x.getFullYear(),x.getMonth()+1,0))]}
  if(freq==='yearly'){return [`${x.getFullYear()}-01-01`,`${x.getFullYear()}-12-31`]}
  return [d,d]}
function countIn(id,from,to){let n=0;for(const k in S.checks){if(k>=from&&k<=to&&S.checks[k].includes(id))n++}return n}
function logDates(id,from,to){return Object.keys(S.checks).filter(k=>k>=from&&k<=to&&S.checks[k].includes(id)).sort()}
const daily=()=>S.routines.filter(r=>r.freq==='daily');
function dayRate(d){const ds=daily();if(!ds.length)return 0;return ds.filter(r=>isOn(d,r.id)).length/ds.length}
function streak(){let n=0,d=TODAY;if(dayRate(d)<.8)d=addDays(d,-1);while(dayRate(d)>=.8&&n<3650){n++;d=addDays(d,-1)}return n}
const ddLabel=n=>n===0?'D-DAY':n>0?'D-'+n:'D+'+(-n);

/* ---------- study plan generation ---------- */
function makeEvent(o){
  const ev={id:uid(),name:o.name,date:o.date,area:o.area||'study',mode:o.mode||'none',start:o.start||TODAY,dailyMin:+o.dailyMin||60,subjects:o.subjects||[],plan:[],weeks:[]};
  buildPlan(ev);return ev}
function phases(n,weeks){ // split n study days (or weeks) into concept / past exams / mock / final
  if(n<=0)return {concept:0,past:0,mock:0,final:0};
  const final=weeks?(n>=3?1:0):(n>=10?2:n>=4?1:0),rest=n-final;
  let concept=Math.max(1,Math.round(rest*.5)),past=Math.round(rest*.3);let mock=rest-concept-past;
  if(mock<0){past+=mock;mock=0}
  return {concept,past,mock,final}}
// unit k (1-based) goes to slot floor((k-1)*count/units); returns the units that land in slot i
function unitRange(units,i,count){const a=Math.ceil(i*units/count)+1,b=Math.ceil((i+1)*units/count);return b>=a?[a,Math.min(b,units)]:null}
function rangeText(sub,r){if(!r)return null;return r[0]===r[1]?`${sub.name} ${r[0]}${sub.unit||''}`:`${sub.name} ${r[0]}~${r[1]}${sub.unit||''}`}
function buildPlan(ev){
  if(ev.mode==='auto')buildAuto(ev);
  else if(ev.mode==='weekly')buildWeeks(ev);
}
function buildAuto(ev){
  const old={};(ev.plan||[]).forEach(p=>{if(p.done)old[p.d+'|'+p.t]=true});
  const from=ev.start, n=diff(from,ev.date); // study days = start .. day before the exam
  const P=phases(n),subs=ev.subjects.length?ev.subjects:[{name:ev.name,units:0,unit:''}];
  const per=Math.max(10,Math.round(ev.dailyMin/subs.length/5)*5);
  const out=[];let i=0;
  const push=(d,t,ph)=>out.push({d,t,ph,done:!!old[d+'|'+t]});
  for(let k=0;k<P.concept;k++,i++){const d=addDays(from,i);
    subs.forEach(s=>{const r=s.units>0?unitRange(s.units,k,P.concept):null;
      const t=s.units>0?(r?`개념 · ${rangeText(s,r)}`:`복습 · ${s.name} 지난 내용 다시 보기 + 문제 풀기`):`개념 · ${s.name} 공부`;push(d,`${t} (약 ${per}분)`,'개념')})}
  for(let k=0;k<P.past;k++,i++){const d=addDays(from,i);
    subs.forEach(s=>push(d,`기출 · ${s.name} 기출 풀이 ${k+1}/${P.past}일차 + 오답 표시 (약 ${per}분)`,'기출'))}
  for(let k=0;k<P.mock;k++,i++){const d=addDays(from,i);
    push(d,k%2===0?`실전 · 모의고사 1회 시간 재고 풀기 (약 ${ev.dailyMin}분)`:`실전 · 오답 노트 정리 + 약점 단원 다시 보기 (약 ${ev.dailyMin}분)`,'실전')}
  for(let k=0;k<P.final;k++,i++){const d=addDays(from,i);
    push(d,k===P.final-1?'최종 · 핵심 요약만 가볍게 훑기, 수험표·신분증 챙기고 일찍 자기':'최종 · 오답 노트와 요약본 한 번 더 보기','최종')}
  ev.plan=out}
function buildWeeks(ev){
  const oldW={};(ev.weeks||[]).forEach(w=>oldW[w.s]=w);
  const first=monday(ev.start),last=monday(addDays(ev.date,-1)>=ev.start?addDays(ev.date,-1):ev.start);
  const starts=[];for(let s=first;s<=last;s=addDays(s,7))starts.push(s);
  const n=starts.length,P=phases(n,true);const subs=ev.subjects;
  ev.weeks=starts.map((s,i)=>{
    let g;
    if(i<P.concept){g=subs.length?'개념 · '+subs.map(x=>x.units>0?(rangeText(x,unitRange(x.units,i,P.concept))||x.name+' 복습'):x.name+' 진도').join(', '):'개념 진도 나가기'}
    else if(i<P.concept+P.past)g='기출 · '+(subs.length?subs.map(x=>x.name).join(', '):'기출')+' 기출 회독';
    else if(i<P.concept+P.past+P.mock)g='실전 · 모의고사 2회 + 오답 정리';
    else g='최종 점검 · 요약본, 오답 노트, 컨디션 관리';
    const o=oldW[s];return {s,goal:o&&o.edited?o.goal:g,edited:!!(o&&o.edited),done:!!(o&&o.done)}})}
function planFor(d){const items=[];
  S.events.forEach(ev=>{
    if(ev.mode==='auto')ev.plan.forEach((p,idx)=>{if(p.d===d)items.push({ev,p,idx})});
  });return items}
function weekGoalsFor(d){const m=monday(d),r=[];S.events.forEach(ev=>{if(ev.mode==='weekly'){const w=ev.weeks.find(w=>w.s===m);if(w)r.push({ev,w})}});return r}

    <div class="row"><button class="btn primary" type="submit">${ev?'저장하고 계획 다시 짜기':'추가하고 계획 짜기'}</button><button class="btn" type="button" id="ef-cancel">취소</button></div>
  </form>`}
const MODE_HELP={auto:'시작일부터 시험 전날까지를 개념 50% → 기출 30% → 실전 모의고사 20% → 마지막 1~2일 최종 점검으로 나눠 날짜별 할 일을 만들어요. 일간 화면에 그날 할 일이 떠요.',
  weekly:'시험까지 남은 주마다 목표 칸을 만들고 단계별 추천 목표를 채워 둬요. 내용은 직접 고칠 수 있어요.',none:'공부 계획 없이 디데이만 표시해요.'};
function evCard(e){
  const a=area(e.area),n=diff(TODAY,e.date),open=openEv===e.id;
  let body='',prog='';
  if(e.mode==='auto'){const done=e.plan.filter(p=>p.done).length;prog=`${done}/${e.plan.length}`;
    const P=phases(diff(e.start,e.date));
    body=`<p class="note">개념 ${P.concept}일 · 기출 ${P.past}일 · 실전 ${P.mock}일 · 최종 ${P.final}일, 하루 약 ${e.dailyMin}분</p>
      <details class="plan"${open?' open':''} data-evdet="${e.id}"><summary>날짜별 계획 보기 (${e.plan.length}개)</summary><div class="planlist">${e.plan.map(p=>`<div class="pd${p.d===TODAY?' today':''}"><span class="d">${fmtMD(p.d)}</span><span>${p.done?`<s>${esc(p.t)}</s>`:esc(p.t)}</span></div>`).join('')||'<span class="empty">시작일이 시험일보다 늦어서 계획을 만들지 못했어요.</span>'}</div></details>`}
  else if(e.mode==='weekly'){const done=e.weeks.filter(w=>w.done).length;prog=`${done}/${e.weeks.length}주`;const cm=monday(TODAY);
    body=`<div class="wkplan">${e.weeks.map((w,i)=>`<div class="w${w.s===cm?' cur':''}"><input type="checkbox" data-wgoal="${e.id}" data-ws="${w.s}"${w.done?' checked':''} aria-label="${fmtMD(w.s)} 주 완료"><span class="wd">${fmtMD(w.s)}~</span><input type="text" data-wedit="${e.id}" data-ws="${w.s}" value="${esc(w.goal)}" aria-label="${fmtMD(w.s)} 주 목표"></div>`).join('')||'<span class="empty">남은 주가 없어요.</span>'}</div>`}
  return `<div class="ev-card" style="border-left:4px solid ${a.c}" id="ev-${e.id}">
    <div class="row between"><div><b style="font-size:16px">${esc(e.name)}</b><div class="note">${e.date.replace(/-/g,'.')} · ${esc(a.name)} · ${e.mode==='auto'?'날짜별 자동 배분':e.mode==='weekly'?'주별 목표':'디데이만'}</div></div><div style="text-align:right"><div class="dday">${ddLabel(n)}</div>${prog?`<span class="pill">${prog}</span>`:''}</div></div>
    ${body}
    <div class="row"><button class="btn sm" data-evedit="${e.id}">수정</button>${e.mode!=='none'?`<button class="btn sm" data-evregen="${e.id}">계획 다시 짜기</button>`:''}<button class="btn sm danger" data-evdel="${e.id}">삭제</button></div>
  </div>`}
let delArm=null;
function renderEvents(){
  const list=[...S.events].sort((a,b)=>a.date.localeCompare(b.date));
  const up=list.filter(e=>e.date>=TODAY),past=list.filter(e=>e.date<TODAY);
  $('v-events').innerHTML=`<div class="page" style="padding:0">
    ${editEv!==null?evForm(editEv?S.events.find(e=>e.id===editEv):null):`<div class="row"><button class="btn primary" id="ev-new">+ 일정 추가</button><span class="note">시험이나 마감일을 넣으면 공부 계획을 짜 줘요.</span></div>`}
    <div class="card"><h3>다가오는 일정</h3>${up.length?up.map(evCard).join(''):'<p class="empty">다가오는 일정이 없어요.</p>'}</div>
    ${past.length?`<div class="card"><h3>지난 일정</h3>${past.map(evCard).join('')}</div>`:''}
  </div>`;
  if(editEv!==null)syncModeHelp();
}
function syncModeHelp(){const m=(document.querySelector('input[name=ef-mode]:checked')||{}).value||'auto';$('ef-modehelp').textContent=MODE_HELP[m];
  document.querySelectorAll('#evform .plan-only').forEach(el=>el.hidden=m==='none')}
function readSubs(){return [...document.querySelectorAll('#ef-subs .subj')].map(r=>({name:r.querySelector('[data-sf=name]').value.trim(),units:Math.max(0,parseInt(r.querySelector('[data-sf=units]').value)||0),unit:r.querySelector('[data-sf=unit]').value.trim()})).filter(s=>s.name)}

/* ---------- MANAGE ---------- */
function renderManage(){
  const freqOpt=r=>Object.entries({daily:'매일',weekly:'주 n회',monthly:'월 n회',yearly:'연 n회'}).map(([k,v])=>`<option value="${k}"${r.freq===k?' selected':''}>${v}</option>`).join('');
  $('v-manage').innerHTML=`<div class="page" style="padding:0">
   <div class="card"><div class="row between"><h3>루틴 목록</h3><button class="btn primary" id="r-add">+ 루틴 추가</button></div>
    <p class="note">주기를 고르고 횟수를 넣으면 일간·주간·월간·연간 화면에 나눠서 보여요. 매일 루틴은 횟수가 필요 없어요.</p>
    ${S.areas.map(a=>{const rs=S.routines.filter(r=>r.area===a.id);return `<div class="area-h" style="--c:${a.c}"><span class="sw"></span>${esc(a.name)} <span class="num">${rs.length}</span></div>
      <div class="list">${rs.map(r=>`<div class="mrow" data-rid="${r.id}">
        <select data-rf="area" aria-label="영역">${S.areas.map(x=>`<option value="${x.id}"${x.id===r.area?' selected':''}>${esc(x.name)}</option>`).join('')}</select>
        <input class="mt" data-rf="title" value="${esc(r.title)}" aria-label="루틴 이름">
        <select data-rf="freq" aria-label="주기">${freqOpt(r)}</select>
        <input data-rf="target" type="number" min="1" inputmode="numeric" value="${r.target}" aria-label="횟수"${r.freq==='daily'?' disabled':''}>
        <button class="btn sm danger" data-rdel="${r.id}">삭제</button></div>`).join('')||'<p class="empty">이 영역에 루틴이 없어요.</p>'}</div>`}).join('')}
   </div>
   <div class="card"><div class="row between"><h3>영역</h3><span class="note">${S.areas.length}개</span></div>
    <div class="list">${S.areas.map(a=>{const n=S.routines.filter(r=>r.area===a.id).length+S.events.filter(e=>e.area===a.id).length;
      return `<div class="arow"><span class="sw" style="--c:${a.c};width:14px;height:14px"></span><input data-aname="${a.id}" value="${esc(a.name)}" aria-label="영역 이름">
      <div class="colors" role="group" aria-label="${esc(a.name)} 색">${COLORS.map(c=>`<button type="button" class="cdot${c===a.c?' on':''}" style="--c:${c}" data-acolor="${a.id}" data-c="${c}" aria-label="색 ${c}" aria-pressed="${c===a.c}"></button>`).join('')}</div>
      <button class="btn sm danger" data-adel="${a.id}"${S.areas.length<2?' disabled title="영역은 하나 이상 있어야 해요"':''}>삭제</button>
      ${n?`<span class="note full-w">루틴·일정 ${n}개 · 삭제하면 다른 영역으로 옮겨져요</span>`:''}</div>`}).join('')}</div>
    <form id="aform" class="row"><input id="a-name" maxlength="20" placeholder="새 영역 이름 (예: 관계·가족, 취미)" aria-label="새 영역 이름" style="flex:1 1 180px" required><button class="btn primary" type="submit">+ 영역 추가</button></form>
   </div>
  </div>`;
}
const COLORS=['#2340E8','#7A3FE0','#13996A','#D9771E','#D6336C','#0E8FA3','#8A6D1F','#5C6178'];

/* ---------- views ---------- */
let view='day';
const R={day:renderDay,week:renderWeek,month:renderMonth,year:renderYear,events:renderEvents,manage:renderManage};
function show(v){view=v;document.querySelectorAll('#vtabs [role=tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.v===v)));
  Object.keys(R).forEach(k=>$('v-'+k).hidden=k!==v);render()}
function render(){renderTop();R[view]();report()}
$('vtabs').addEventListener('click',e=>{const b=e.target.closest('[role=tab]');if(b)show(b.dataset.v)});

/* ---------- events (delegated) ---------- */
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.chk){const on=t.type==='checkbox'?t.checked:undefined;toggle(t.dataset.d,t.dataset.chk,on);render();return}
  if(t.dataset.plan){const ev=S.events.find(x=>x.id===t.dataset.plan);ev.plan[+t.dataset.idx].done=t.checked;write();render();return}
  if(t.dataset.wgoal){const ev=S.events.find(x=>x.id===t.dataset.wgoal);const w=ev.weeks.find(w=>w.s===t.dataset.ws);w.done=t.checked;write();render();return}
  if(t.dataset.wedit){const ev=S.events.find(x=>x.id===t.dataset.wedit);const w=ev.weeks.find(w=>w.s===t.dataset.ws);w.goal=t.value;w.edited=true;write();toast('주 목표를 저장했어요');return}
  if(t.name==='ef-mode'){syncModeHelp();report();return}
  const row=t.closest('.mrow');if(row){const r=S.routines.find(x=>x.id===row.dataset.rid),f=t.dataset.rf;
    r[f]=f==='target'?Math.max(1,parseInt(t.value)||1):t.value;if(f==='freq'&&r.freq==='daily')r.target=1;write();renderTop();if(f==='area'||f==='freq')renderManage();report();return}
  if(t.dataset.aname){const a=S.areas.find(x=>x.id===t.dataset.aname);a.name=t.value.trim()||a.name;write();return}
});
document.addEventListener('input',e=>{if(e.target.id==='memo'){const v=e.target.value;if(v)S.memo[dSel]=v;else delete S.memo[dSel];clearTimeout(window.__m);window.__m=setTimeout(write,500)}});
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-goev],[data-goday]');if(!t)return;
  const d=t.dataset;
  if(d.chk&&t.classList.contains('cell')){toggle(d.d,d.chk);render();return}
  if(d.dnav!==undefined){dSel=d.dnav==='0'?TODAY:addDays(dSel,+d.dnav);render();return}
  if(d.wnav!==undefined){wSel=d.wnav==='0'?monday(TODAY):addDays(wSel,7*d.wnav);render();return}
  if(d.mnav!==undefined){if(d.mnav==='0')mSel=TODAY.slice(0,7);else{const [y,m]=mSel.split('-').map(Number);const x=new Date(y,m-1+(+d.mnav),1);mSel=`${x.getFullYear()}-${pad(x.getMonth()+1)}`}render();return}
  if(d.ynav!==undefined){ySel+=+d.ynav;render();return}
  if(d.goday){dSel=d.goday;show('day');return}
  if(d.gomonth){mSel=d.gomonth;show('month');return}
  if(d.goev){openEv=d.goev;editEv=null;show('events');const el=$('ev-'+d.goev);if(el)el.scrollIntoView({block:'start'});return}
  if(d.log){toggle(TODAY,d.log,true);toast('오늘 날짜로 기록했어요');render();return}
  if(d.unlog){const ds=logDates(d.unlog,`${ySel}-01-01`,`${ySel}-12-31`);if(ds.length){toggle(ds[ds.length-1],d.unlog,false);render()}return}
  if(t.id==='ev-new'){editEv='';render();$('ef-name').focus();return}
  if(t.id==='ef-cancel'){editEv=null;render();return}
  if(t.id==='ef-addsub'){const box=$('ef-subs');const subs=readSubs();box.innerHTML=subjRows([...subs,{name:'',units:'',unit:'강'}]);report();return}
  if(d.subrm!==undefined){const rows=[...document.querySelectorAll('#ef-subs .subj')];rows[+d.subrm]?.remove();if(!$('ef-subs').children.length)$('ef-subs').innerHTML=subjRows([]);
    document.querySelectorAll('#ef-subs [data-subrm]').forEach((b,i)=>b.dataset.subrm=i);report();return}
  if(d.evedit){editEv=d.evedit;render();$('evform').scrollIntoView({block:'start'});return}
  if(d.evregen){const ev=S.events.find(x=>x.id===d.evregen);if(ev.mode==='weekly')ev.weeks.forEach(w=>w.edited=false);buildPlan(ev);write();openEv=ev.id;render();toast('계획을 다시 짰어요. 이미 체크한 항목은 유지돼요.');return}
  if(d.evdel){if(delArm!==d.evdel){delArm=d.evdel;t.textContent='한 번 더 누르면 삭제';setTimeout(()=>{if(delArm===d.evdel){delArm=null;if(t.isConnected)t.textContent='삭제'}},3000);return}
    S.events=S.events.filter(x=>x.id!==d.evdel);delArm=null;write();render();toast('일정을 삭제했어요');return}
  if(d.acolor){const a=S.areas.find(x=>x.id===d.acolor);a.c=d.c;write();render();return}
  if(d.adel){if(S.areas.length<2)return;
    if(delArm!==d.adel){delArm=d.adel;t.textContent='한 번 더 누르면 삭제';setTimeout(()=>{if(delArm===d.adel){delArm=null;if(t.isConnected)t.textContent='삭제'}},3000);return}
    const rest=S.areas.filter(x=>x.id!==d.adel),to=rest[0];
    S.routines.forEach(r=>{if(r.area===d.adel)r.area=to.id});S.events.forEach(e=>{if(e.area===d.adel)e.area=to.id});
    S.areas=rest;delArm=null;write();render();toast(`영역을 삭제했어요. 남은 루틴·일정은 ${to.name}(으)로 옮겼어요.`);return}
  if(t.id==='r-add'){S.routines.push({id:uid(),area:S.areas[0].id,title:'새 루틴',freq:'daily',target:1});write();renderManage();report();const ins=document.querySelectorAll('.mrow [data-rf=title]');const last=[...ins].find(i=>i.value==='새 루틴');if(last){last.focus();last.select()}return}
  if(d.rdel){if(delArm!==d.rdel){delArm=d.rdel;t.textContent='한 번 더';setTimeout(()=>{if(delArm===d.rdel){delArm=null;if(t.isConnected)t.textContent='삭제'}},3000);return}
    S.routines=S.routines.filter(x=>x.id!==d.rdel);delArm=null;write();renderManage();renderTop();report();return}
});
document.addEventListener('toggle',e=>{if(e.target.dataset&&e.target.dataset.evdet)openEv=e.target.open?e.target.dataset.evdet:null;report()},true);
document.addEventListener('submit',e=>{if(e.target.id!=='aform')return;e.preventDefault();
  const name=$('a-name').value.trim();if(!name)return;
  if(S.areas.some(a=>a.name===name)){toast('같은 이름의 영역이 이미 있어요');return}
  const used=S.areas.map(a=>a.c),c=COLORS.find(x=>!used.includes(x))||COLORS[S.areas.length%COLORS.length];
  S.areas.push({id:'a'+uid(),name,c});write();render();toast(`"${name}" 영역을 추가했어요. 위 루틴 목록에서 루틴을 넣어 보세요.`)});
document.addEventListener('submit',e=>{if(e.target.id!=='evform')return;e.preventDefault();
  const name=$('ef-name').value.trim(),date=$('ef-date').value;if(!name||!date)return;
  const mode=document.querySelector('input[name=ef-mode]:checked').value;
  const start=$('ef-start').value||TODAY;if(mode!=='none'&&start>=date){toast('공부 시작일은 일정 날짜보다 앞이어야 해요');$('ef-start').focus();return}
  const o={name,date,area:$('ef-area').value,mode,start,dailyMin:Math.max(10,parseInt($('ef-min').value)||60),subjects:readSubs()};
  const id=e.target.dataset.id;let ev;
  if(id){ev=S.events.find(x=>x.id===id);const keepEdits=ev.mode===mode;Object.assign(ev,o);if(!keepEdits){ev.plan=[];ev.weeks=[]}buildPlan(ev)}
  else{ev=makeEvent(o);S.events.push(ev)}
  write();editEv=null;openEv=ev.id;render();toast(mode==='none'?'일정을 추가했어요':'공부 계획을 짰어요. 일간 화면에 날짜별로 나타나요.');
});

/* ---------- iframe height + day rollover ---------- */
function report(){try{if(parent!==window){const h=Math.ceil($('page').getBoundingClientRect().height)+40;parent.postMessage({type:'myplan-routine-height',height:h},location.origin)}}catch(e){}}
new ResizeObserver(report).observe($('page'));
setInterval(()=>{const t=ymd(new Date());if(t!==TODAY){if(dSel===TODAY)dSel=t;TODAY=t;render()}},60000);
window.myPlanRoutineActions={clearChecks(){S.checks={};S.memo={};S.events.forEach(e=>{e.plan.forEach(p=>p.done=false);e.weeks.forEach(w=>w.done=false)});write();render()}};
show('day');
})();
</script>
</body>
</html>
